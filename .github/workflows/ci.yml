name: parity
on: [push, pull_request]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Every parity suite
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || fail=1
          done
          exit $fail
