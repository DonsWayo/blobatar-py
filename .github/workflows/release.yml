name: release

# Publishes to PyPI via Trusted Publishing (OIDC). No API token is stored
# anywhere: PyPI verifies the workflow identity directly.
#
# One-time setup on PyPI → Publishing → Add a new pending publisher:
#   PyPI project name : blobatar
#   Owner             : DonsWayo
#   Repository name   : blobatar-py
#   Workflow name     : release.yml
#   Environment name  : pypi

on:
  push:
    tags: ["v*"]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Every parity suite must pass before anything is built
        # Every suite runs even after one fails. Under `bash -e` the loop
        # stopped at the first failure, so a tolerance miss in the colour
        # intermediates hid whether the observable output still matched --
        # which is the tier that actually gates a release.
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || fail=1
          done
          exit $fail

  build:
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
